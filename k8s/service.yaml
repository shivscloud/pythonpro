apiVersion: v1
kind: Service

metadata:
  name: rajeshapp-service
  namespace: rajeshapp

  labels:
    app.kubernetes.io/name: rajeshapp
    app.kubernetes.io/part-of: rajeshapp

spec:
  type: NodePort

  selector:
    app.kubernetes.io/name: rajeshapp

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080