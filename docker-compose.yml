version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: rajdb
      POSTGRES_USER: rajuser
      POSTGRES_PASSWORD: changeme
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  web:
    build: .
    ports:
      - '8080:8080'
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: rajdb
      DATABASE_USER: rajuser
      DATABASE_PASSWORD: changeme
      DATABASE_PORT: '5432'
      DATABASE_SSLMODE: disable
      FLASK_ENV: development
    depends_on:
      - db
    volumes:
      - .:/app:cached

volumes:
  db_data:
