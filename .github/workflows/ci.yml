name: CI

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - "auth-service/**"
      - "grievance-service/**"
      - "audit-service/**"
      - "frontend-service/**"
      - "helm/rajeshapp/**"
      - "k8s/**"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - grievance-service
          - audit-service
          - frontend-service

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt
          pip install flake8 pytest

      - name: Lint
        run: |
          flake8 ${{ matrix.service }}

      - name: Test
        working-directory: ${{ matrix.service }}
        run: |
          if [ -d "tests" ]; then
            pytest -v
          else
            echo "No tests directory found - skipping pytest"
          fi


  docker:
    name: Build & Scan ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs: test

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - grievance-service
          - audit-service
          - frontend-service

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: |
            ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"


  helm:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Helm lint
        working-directory: helm/rajeshapp
        run: |
          helm lint .

      - name: Helm template
        working-directory: helm/rajeshapp
        run: |
          helm template rajeshapp . > rendered.yaml

      - name: Install kubeconform
        run: |
          VERSION="0.7.0"

          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/v${VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o kubeconform.tar.gz

          tar -xzf kubeconform.tar.gz

          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        working-directory: helm/rajeshapp
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            rendered.yaml