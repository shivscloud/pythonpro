<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Case Details PDF</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    h2 { color: #333; }
    p { font-size: 16px; }
  </style>
</head>
<body>
  <h2>Case Details</h2>
  <p><strong>Court Name:</strong> {{ case.court }}</p>
  <p><strong>Case Type:</strong> {{ case.case_type }}</p>
  <p><strong>Case Number:</strong> {{ case.case_number }}</p>
  <p><strong>Submitted On:</strong> {{ case.submitted_on }}</p>
</body>
</html>
