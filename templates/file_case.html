<!-- templates/file_case.html -->
<!DOCTYPE html>
<html>
<head>
  <title>File New Case</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h3>File a New Case</h3>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Court Name</label>
      <select name="court" class="form-select" required>
        <option value="">Select Court</option>
        {% for court in courts %}
          <option value="{{ court }}">{{ court }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label>Case Type</label>
      <input type="text" name="case_type" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Case Number</label>
      <input type="text" name="case_number" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Filing Year</label>
      <input type="text" name="filing_year" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Submission Date</label>
      <input type="date" name="submission_date" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Proposal Hearing Date</label>
      <input type="date" name="proposal_hearing_date" class="form-control">
    </div>

    <div class="mb-3">
      <label>Parties' Names</label>
      <textarea name="parties" class="form-control" rows="3" required></textarea>
    </div>

    <button type="submit" class="btn btn-success">Submit Case</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
</body>
</html>
